<div class="payment-method" data-bind="css: {'_active': getCode() === isChecked()}">
    <div class="payment-method-box">
        <div class="payment-method-title field choice">
            <input
                type="radio"
                name="payment[method]"
                class="input input-radio"
                data-bind="
                    attr: {id: getCode()},
                    value: getCode(),
                    checked: isChecked,
                    click: selectPaymentMethod,
                    visible: isRadioButtonVisible()
                " />
            <label class="label" data-bind="attr: {for: getCode()}">
                <span data-bind="text: getTitle()"></span>
            </label>
        </div>

        <div data-bind="attr: {class: 'payment-method-content container-' + getCode()}">
            <form data-bind="attr: {id: 'form_' + getCode()}">
                <fieldset
                    data-bind="
                        attr: {
                            class: 'fieldset payment items ccard ' + getCode(),
                            id: 'payment_form_' + getCode()
                        },
                        visible: showCardData
                    ">

                    <!--=== Pagamento com Cartão de Crédito ===-->
                    <div class="field number required">
                        <h3 data-bind="i18n: 'Pagamento com Cartão de Crédito'"></h3>
                        <label class="label" for="card_amount">
                            <span>Valor a pagar com Cartão de Crédito:</span>
                        </label>
                        <div class="control">
                            <input
                                type="text"
                                name="payment[card_amount]"
                                id="card_amount"
                                placeholder="0,00"
                                class="input-text-vindi"
                                data-bind="enable: isActive($parents)"
                            />
                        </div>
                        <!-- Error message for card amount -->
                        <div class="field-error" data-bind="visible: showCardError">
                            <span data-bind="text: cardErrorMessage"></span>
                        </div>
                    </div>

                    <!-- existing credit‐card fields -->
                    <!-- ko if: hasPaymentProfiles() -->
                    <div class="field number required">
                        <label class="label" data-bind="attr: {for: getCode() + '_cc_payment_profile'}">
                            <span data-bind="i18n: 'Seus cartões salvos'"></span>
                        </label>
                        <div class="control">
                            <select
                                name="payment[payment_profile]"
                                class="input-text select"
                                data-bind="
                                    attr: {id: getCode() + '_cc_payment_profile'},
                                    enable: isActive($parents),
                                    options: getPaymentProfiles(),
                                    optionsValue: 'value',
                                    optionsText: 'text',
                                    optionsCaption: $t('Novo Cartão'),
                                    value: selectedPaymentProfile,
                                    valueUpdate: 'change'
                                ">
                            </select>
                        </div>
                    </div>
                    <!-- /ko -->

                    <div class="field number cc-number required vindi-cc-number-container" data-bind="visible: !selectedPaymentProfile()">
                        <div class="credit-card-types-container">
                            <ul class="credit-card-types">
                                <!-- ko foreach: { data: getCcAvailableTypesValues(), as: 'item' } -->
                                <li class="item" data-bind="
                                    css: {
                                        _active: $parent.selectedCardType() == item.value,
                                        _inactive: $parent.selectedCardType() != null && $parent.selectedCardType() != item.value
                                    }
                                ">
                                    <!-- ko if: $parent.getIcons(item.value) -->
                                    <img data-bind="attr: {
                                        src: $parent.getIcons(item.value).url,
                                        alt: item.type,
                                        width: $parent.getIcons(item.value).width,
                                        height: $parent.getIcons(item.value).height
                                    }" />
                                    <!-- /ko -->
                                </li>
                                <!-- /ko -->
                            </ul>
                        </div>
                        <div class="control">
                            <input
                                type="number"
                                name="payment[cc_number]"
                                class="input-text-vindi"
                                data-bind="attr: {
                                    id: getCode() + '_cc_number',
                                    placeholder: $t('Número do Cartão'),
                                    'data-validate': JSON.stringify({'required-number':true})
                                },
                                change: updateInstallmentsValues,
                                enable: isActive($parents),
                                value: vindiCreditCardNumber,
                                valueUpdate: 'keyup'"
                            />
                        </div>
                    </div>

                    <div class="field number required" data-bind="visible: !selectedPaymentProfile()">
                        <label class="label" data-bind="attr: {for: getCode() + '_cc_owner'}">
                            <span data-bind="i18n: 'Nome no Cartão'"></span>
                        </label>
                        <div class="control">
                            <input
                                type="text"
                                name="payment[cc_owner]"
                                class="input-text-vindi"
                                data-bind="attr: {
                                    id: getCode() + '_cc_owner',
                                    placeholder: $t('Nome no Cartão'),
                                    'data-validate': JSON.stringify({'required':true})
                                },
                                enable: isActive($parents),
                                value: creditCardOwner,
                                valueUpdate: 'keyup'"
                            />
                        </div>
                    </div>

                    <div class="field number required vindi-cc-exp" data-bind="visible: !selectedPaymentProfile()">
                        <label class="label" data-bind="attr: {for: getCode() + '_cc_exp_date'}">
                            <span data-bind="i18n: 'Data de Validade'"></span>
                        </label>
                        <div class="control">
                            <input
                                type="text"
                                name="payment[cc_exp_date]"
                                class="input-text-vindi"
                                pattern="[0-9]*"
                                inputmode="numeric"
                                data-mask="99/99"
                                data-bind="attr: {
                                    id: getCode() + '_cc_exp_date',
                                    placeholder: $t('MM/AA'),
                                    'data-validate': JSON.stringify({'required-number':true})
                                },
                                enable: isActive($parents),
                                value: creditCardExpDate,
                                valueUpdate: 'keyup'"
                            />
                        </div>
                    </div>

                    <div class="field number required" data-bind="visible: !selectedPaymentProfile()">
                        <label class="label" data-bind="attr: {for: getCode() + '_cc_cid'}">
                            <span data-bind="i18n: 'CVV'"></span>
                        </label>
                        <div class="control">
                            <input
                                type="text"
                                name="payment[cc_cid]"
                                class="input-text-vindi"
                                maxlength="4"
                                data-bind="attr: {
                                    id: getCode() + '_cc_cid',
                                    placeholder: $t('CVV'),
                                    'data-validate': JSON.stringify({'required-number':true})
                                },
                                enable: isActive($parents),
                                value: creditCardVerificationNumber"
                            />
                        </div>
                    </div>

                    <!-- CVV field for saved cards (required) -->
                    <div class="field number required" data-bind="visible: selectedPaymentProfile()">
                        <label class="label" data-bind="attr: {for: getCode() + '_cc_cid_saved'}">
                            <span data-bind="i18n: 'CVV'"></span>
                        </label>
                        <div class="control">
                            <input
                                type="text"
                                name="payment[cc_cid]"
                                class="input-text-vindi"
                                maxlength="4"
                                data-bind="attr: {
                                    id: getCode() + '_cc_cid_saved',
                                    placeholder: $t('CVV'),
                                    'data-validate': JSON.stringify({'required-number':true})
                                },
                                enable: isActive($parents),
                                value: creditCardVerificationNumber"
                            />
                        </div>
                    </div>

                    <div class="field save-card" data-bind="visible: !selectedPaymentProfile()">
                        <label for="save_card_checkbox" class="label">
                            <input
                                type="checkbox"
                                id="save_card_checkbox"
                                name="payment[save_card]"
                                class="input-checkbox"
                                data-bind="checked: saveCard" />
                            <span data-bind="i18n: 'Salvar cartão para uso futuro'"></span>
                        </label>
                    </div>

                    <div class="field installments required">
                        <label class="label"><span data-bind="i18n: 'Parcelas'"></span></label>
                        <div class="control">
                            <select
                                name="payment[installments]"
                                class="select"
                                data-bind="attr: {
                                    id: getCode() + '_cc_installments',
                                    'data-validate': JSON.stringify({required:true})
                                },
                                enable: hasInstallments,
                                disable: installmentsDisabled,
                                options: installments,
                                optionsValue: 'installments',
                                optionsText: 'text',
                                optionsCaption: $t('Installments'),
                                value: creditCardInstallments"
                            ></select>
                        </div>
                    </div>

                    <hr>

                    <!--=== Pagamento com PIX ===-->
                    <div class="field number required">
                        <h3 data-bind="i18n: 'Pagamento com PIX'"></h3>
                        <label class="label" for="pix_amount">
                            <span>Valor a pagar com PIX:</span>
                        </label>
                        <div class="control">
                            <input
                                type="text"
                                name="payment[pix_amount]"
                                id="pix_amount"
                                placeholder="0,00"
                                class="input-text-vindi"
                                data-bind="enable: isActive($parents)" />
                        </div>
                        <!-- Error message for pix amount -->
                        <div class="field-error" data-bind="visible: showPixError">
                            <span data-bind="text: pixErrorMessage"></span>
                        </div>
                    </div>
                    <div class="field">
                        <div class="control">
                            <small data-bind="i18n: 'Os dados para o pagamento serão exibidos após finalizar o pedido.'"></small>
                        </div>
                    </div>
                    <div class="field number required">
                        <label class="label" data-bind="i18n: 'CPF/CNPJ *'"></label>
                        <div class="control">
                            <input
                                type="text"
                                name="payment[pix_taxvat]"
                                class="input-text-vindi cpf-cnpj"
                                maxlength="14"
                                data-bind="attr: {
                                    title: $t('CPF'),
                                    placeholder: $t('CPF'),
                                    id: getCode() + '_taxvat',
                                    'data-container': getCode() + '-taxvat',
                                    'data-validate': getVatValidation()
                                },
                                enable: isActive($parents),
                                value: taxvat,
                                valueUpdate: 'keyup'" />
                        </div>
                    </div>

                    <!-- Knockout-rendered messages, billing address, agreements, etc. -->
                    <!-- ko foreach: getRegion('messages') --> <!-- ko template: getTemplate() --> <!-- /ko --> <!-- /ko -->
                    <!-- ko if: isCheckoutPage() -->
                    <div class="payment-method-billing-address">
                        <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
                        <!-- ko template: getTemplate() --> <!-- /ko --> <!-- /ko -->
                    </div>
                    <div class="checkout-agreements-block">
                        <!-- ko foreach: $parent.getRegion('before-place-order') -->
                        <!-- ko template: getTemplate() --> <!-- /ko --> <!-- /ko -->
                    </div>
                    <!-- /ko -->

                </fieldset>
            </form>

            <!-- Place Order button -->
            <!-- ko if: isCheckoutPage() -->
            <div class="actions-toolbar">
                <div class="primary">
                    <button
                        type="submit"
                        class="action primary checkout"
                        data-bind="click: placeOrder, attr: {title: $t('Finalizar Pedido')}">
                        <span data-bind="i18n: 'Finalizar Pedido'"></span>
                    </button>
                </div>
            </div>
            <!-- /ko -->

        </div>
    </div>
</div>
